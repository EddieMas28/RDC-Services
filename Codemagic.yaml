workflows:
  rdc-android:
    name: RDC-Services APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        NODE_VERSION: 20.19.0
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
