workflows:
  flutter-ios:
    name: RDC-Services iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Recreate folders
        script: |
          flutter create . --platforms=ios,android --project-name rdc_services
          ls ios/
      - name: Get packages
        script: |
          flutter pub get
          if [ -f "ios/Podfile" ]; then
            cd ios && pod install && cd ..
          else
            echo "Podfile not found, skipping pod install"
          fi
      - name: Build IPA no signing
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload
          zip -r app-release.ipa Payload
          ls -lh
    artifacts:
      - build/ios/iphoneos/*.ipa
