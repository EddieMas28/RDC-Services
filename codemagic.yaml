workflows:
  flutter-apk:
    name: RDC-Services APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Recreate missing android folder
        script: |
          if [ ! -d "android" ]; then
            echo "Android folder missing, recreating project..."
            flutter create --platforms=android . --project-name rdc_services
          fi
          ls -la
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
