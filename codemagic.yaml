workflows:
  flutter-apk:
    name: RDC-Services APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Check project structure
        script: |
          ls -la
          pwd
          find . -name "pubspec.yaml"
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
